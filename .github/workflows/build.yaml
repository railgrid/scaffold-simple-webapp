name: Build

# Smoke-tests the app, then builds and pushes the Railpack image — the same
# builder App Studio uses for user projects, so a green build here proves the
# scaffold is buildable exactly the way real projects are built. Pushes happen
# on main (latest + sha-<commit>) and on v* tags (<tag> + latest); PRs run the
# smoke test only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, build, serve, probe
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build
          PORT=8090 npm start &
          for i in $(seq 1 15); do
            curl -fsS localhost:8090/ | grep -qi kedge && exit 0
            sleep 1
          done
          exit 1

  build:
    name: Build app image with Railpack
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image coordinates
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}/app" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Railpack
        uses: iloveitaly/github-action-railpack@167ed71230addc378f3fb13122046c09f71c0e5f
        with:
          context: "."
          # Multi-arch so the image also runs on arm64 clusters (Apple Silicon
          # kind/tilt dev environments); arm64 builds run under QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          cache: true
          cache_tag: ${{ steps.image.outputs.name }}:buildcache
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
